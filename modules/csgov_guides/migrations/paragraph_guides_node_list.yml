id: csgov_migrate_paragraph_guides_node_list
label: 'Paragraph - Node List (Consolidated)'
migration_group: csgov_guides
migration_tags:
  - csgov_guides
  - csgov_migrate
  - csgov_migrate_paragraph
  - csgov_migrate_editor_guide

source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls: 'profiles/contrib/csgov/modules/csgov_guides/data/paragraph_csgov_node_list.json'
  item_selector: ''

  ids:
    uuid:
      type: string

  fields:
    - name: uuid
      selector: uuid
    - name: langcode
      selector: langcode
    - name: status
      selector: status
    - name: created
      selector: created
    - name: field_csgov_p_title
      selector: field_csgov_p_title
    - name: field_csgov_p_content
      selector: field_csgov_p_content
    - name: field_csgov_p_nodes
      selector: field_csgov_p_nodes
    - name: field_csgov_p_view_mode
      selector: field_csgov_p_view_mode
    - name: field_csgov_p_columns
      selector: field_csgov_p_columns
    - name: field_csgov_p_link
      selector: field_csgov_p_link

destination:
  plugin: entity_reference_revisions:paragraph
  default_bundle: csgov_node_list

process:
  uuid: uuid
  id:
    plugin: entity_lookup
    source: uuid
    entity_type: paragraph
    value_key: uuid
  langcode: langcode
  status: status
  created: created

  field_csgov_p_title: field_csgov_p_title

  field_csgov_p_content/value: field_csgov_p_content
  field_csgov_p_content/format:
    plugin: default_value
    default_value: basic_html

  field_csgov_p_nodes:
    - plugin: callback
      source: field_csgov_p_nodes
      callable: csgov_migrate_process_multiple
    - plugin: sub_process
      process:
        target_id:
          - plugin: entity_lookup
            source: value
            entity_type: node
            value_key: uuid

  field_csgov_p_view_mode: field_csgov_p_view_mode
  field_csgov_p_columns: field_csgov_p_columns
  field_csgov_p_link: field_csgov_p_link
