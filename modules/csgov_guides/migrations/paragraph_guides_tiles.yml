id: csgov_migrate_paragraph_guides_tiles
label: 'Paragraph - Tiles (Consolidated)'
migration_group: csgov_guides
migration_tags:
  - csgov_guides
  - csgov_migrate
  - csgov_migrate_paragraph
  - csgov_migrate_editor_guide
migration_dependencies:
  required:
    - csgov_migrate_paragraph_guides_tile

source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls: 'profiles/contrib/csgov/modules/csgov_guides/data/paragraph_csgov_tiles.json'
  item_selector: ''

  ids:
    uuid:
      type: string

  fields:
    - name: uuid
      selector: uuid
    - name: langcode
      selector: langcode
    - name: status
      selector: status
    - name: created
      selector: created
    - name: field_csgov_p_title
      selector: field_csgov_p_title
    - name: field_csgov_p_tiles
      selector: field_csgov_p_tiles
    - name: field_csgov_p_columns
      selector: field_csgov_p_columns
    - name: field_csgov_p_no_border
      selector: field_csgov_p_no_border

destination:
  plugin: entity_reference_revisions:paragraph
  default_bundle: csgov_tiles

process:
  uuid: uuid
  id:
    plugin: entity_lookup
    source: uuid
    entity_type: paragraph
    value_key: uuid
  langcode: langcode
  status: status
  created: created

  field_csgov_p_title: field_csgov_p_title

  field_csgov_p_tiles:
    - plugin: callback
      source: field_csgov_p_tiles
      callable: csgov_migrate_process_multiple
    - plugin: sub_process
      process:
        - plugin: migration_lookup
          source: value
          migration:
            - csgov_migrate_paragraph_guides_tile
          no_stub: true
    - plugin: callback
      callable: csgov_migrate_process_reference

  field_csgov_p_columns: field_csgov_p_columns
  field_csgov_p_no_border: field_csgov_p_no_border
