id: csgov_migrate_node_guides_overview
label: 'Node - Guide Overview (Consolidated)'
migration_group: csgov_guides
migration_tags:
  - csgov_guides
  - csgov_migrate
  - csgov_migrate_node
  - csgov_migrate_editor_guide
migration_dependencies:
  required:
    - csgov_migrate_node_guides_steps
    - csgov_migrate_paragraph_guides_node_list

source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls: 'profiles/contrib/csgov/modules/csgov_guides/data/node_csgov_guide_overview.json'
  item_selector: ''

  ids:
    uuid:
      type: string

  fields:
    - name: uuid
      selector: uuid
    - name: langcode
      selector: langcode
    - name: status
      selector: status
    - name: title
      selector: title
    - name: created
      selector: created
    - name: changed
      selector: changed
    - name: promote
      selector: promote
    - name: sticky
      selector: sticky
    - name: field_csgov_teaser
      selector: field_csgov_teaser
    - name: field_csgov_content_components
      selector: field_csgov_content_components
    - name: field_csgov_guide_parent
      selector: field_csgov_guide_parent
    - name: field_csgov_guide_step_label
      selector: field_csgov_guide_step_label
    - name: field_csgov_guide_annotation
      selector: field_csgov_guide_annotation
    - name: field_csgov_guide_variant
      selector: field_csgov_guide_variant
    - name: field_csgov_icon
      selector: field_csgov_icon
    - name: field_csgov_ref_person
      selector: field_csgov_ref_person
    - name: field_csgov_main_image
      selector: field_csgov_main_image
    - name: field_csgov_guide_items
      selector: field_csgov_guide_items
    - name: field_csgov_guide_noprefix
      selector: field_csgov_guide_noprefix
    - name: path
      selector: path

destination:
  plugin: entity:node
  default_bundle: csgov_guide_overview

process:
  uuid: uuid
  nid:
    plugin: entity_lookup
    source: uuid
    entity_type: node
    value_key: uuid
  langcode: langcode
  status: status
  uid:
    plugin: default_value
    default_value: 0
  title: title
  created: created
  changed: changed
  promote: promote
  sticky: sticky

  field_csgov_teaser: field_csgov_teaser

  field_csgov_guide_items:
    - plugin: callback
      source: field_csgov_guide_items
      callable: csgov_migrate_process_multiple
    - plugin: sub_process
      process:
        target_id:
          - plugin: migration_lookup
            source: value
            migration:
              - csgov_migrate_node_guides_steps
            no_stub: true

  field_csgov_guide_noprefix: field_csgov_guide_noprefix

  field_csgov_content_components:
    - plugin: callback
      source: field_csgov_content_components
      callable: csgov_migrate_process_multiple
    - plugin: sub_process
      process:
        - plugin: migration_lookup
          source: value
          migration:
            - csgov_migrate_paragraph_guides_accordion_item
            - csgov_migrate_paragraph_guides_accordion
            - csgov_migrate_paragraph_guides_content
            - csgov_migrate_paragraph_guides_image
            - csgov_migrate_paragraph_guides_image_text
            - csgov_migrate_paragraph_guides_infopanel
            - csgov_migrate_paragraph_guides_attachments
            - csgov_migrate_paragraph_guides_gallery
            - csgov_migrate_paragraph_guides_tile
            - csgov_migrate_paragraph_guides_tiles
            - csgov_migrate_paragraph_guides_node_list
            - csgov_migrate_paragraph_guides_statsbar_item
            - csgov_migrate_paragraph_guides_statsbar
          no_stub: true
    - plugin: callback
      callable: csgov_migrate_process_reference

  field_csgov_main_image:
    plugin: migration_lookup
    source: field_csgov_main_image
    migration: csgov_migrate_media_guides_image
    no_stub: true

  path/alias:
    - plugin: skip_on_empty
      source: path
      method: process
    - plugin: get
      source: path
  path/langcode:
    - plugin: skip_on_empty
      source: path
      method: process
    - plugin: default_value
      default_value: cs
  path/pathauto:
    - plugin: skip_on_empty
      source: path
      method: process
    - plugin: default_value
      default_value: 0
